// IMPORTANT: Start your code on the 2nd line

"use strict";

(() => {
  if (Services.appinfo.inSafeMode) {
    return;
  }

  const startupTopic = "browser-delayed-startup-finished";
  const targetKey = "N";
  const targetModifiers = "accel,shift";

  function patchBrowserWindow(window) {
    if (!window || window.closed || window.location.href !== "chrome://browser/content/browser.xhtml") {
      return;
    }

    const document = window.document;

    const privateKey = document.getElementById("key_privatebrowsing");
    if (privateKey) {
      privateKey.setAttribute("modifiers", targetModifiers);
      privateKey.setAttribute("key", targetKey);
    }

    const undoCloseWindowKey = document.getElementById("key_undoCloseWindow");
    if (undoCloseWindowKey) {
      const undoKey = (undoCloseWindowKey.getAttribute("key") || "").toUpperCase();
      const undoModifiers = (undoCloseWindowKey.getAttribute("modifiers") || "")
        .split(",")
        .map(modifier => modifier.trim().toLowerCase())
        .filter(Boolean);

      const isConflictingKey = undoKey === targetKey;
      const isConflictingModifiers = undoModifiers.includes("accel") && undoModifiers.includes("shift");

      if (isConflictingKey && isConflictingModifiers) {
        undoCloseWindowKey.setAttribute("disabled", "true");
      }
    }
  }

  Services.obs.addObserver((subject, topic) => {
    if (topic !== startupTopic) {
      return;
    }

    patchBrowserWindow(subject);
  }, startupTopic);

  const windows = Services.wm.getEnumerator("navigator:browser");
  while (windows.hasMoreElements()) {
    patchBrowserWindow(windows.getNext());
  }
})();
